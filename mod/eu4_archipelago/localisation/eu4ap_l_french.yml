l_french:
 eu4ap_bind_title:0 "§MArchipelago : lier cette campagne§!"
 eu4ap_bind_desc:0 "Lie ce pays au joueur Archipelago du mod installé et pose les entraves de départ."
 eu4ap_rescan_title:0 "§MArchipelago : vérifier les objectifs§!"
 eu4ap_rescan_desc:0 "Applique les objets installés, vérifie les objectifs et réécrit l'état dans le journal du jeu."
 eu4ap_ratify_title:0 "§MArchipelago : ratifier la victoire§!"
 eu4ap_ratify_desc:0 "Exige l'ambition « Great Power » et 3 Sceaux du multiworld et les clés ou paliers associés."
 eu4ap_pilgrimage_title:0 "§MArchipelago : pèlerinage d'or§!"
 eu4ap_pilgrimage_desc:0 "Dépense 3000 ducats sans emprunt pour accomplir le pèlerinage d'or."
 eu4ap.3.t:0 "Archipelago : livraisons du multiworld"
 eu4ap.3.d:0 "Des objets envoyés par les autres joueurs du multiworld viennent d'arriver. Les modificateurs « Archipelago » indiquent les entraves restantes."
 eu4ap.3.a:0 "Excellent."
 eu4ap_claim_delivery_title:0 "§MArchipelago : réceptionner une livraison§!"
 eu4ap_claim_delivery_desc:0 "Saisissez le code à 4 chiffres affiché par le client Archipelago pour recevoir immédiatement un objet du multiworld."
 eu4ap.20.t:0 "Archipelago : code de livraison (premier chiffre)"
 eu4ap.20.d:0 "Choisissez le premier chiffre du code affiché par le client."
