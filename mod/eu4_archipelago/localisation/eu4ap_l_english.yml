 eu4ap_bind_title:0 "§MArchipelago: bind this campaign§!"
 eu4ap_bind_desc:0 "Binds this country to the installed Archipelago slot and applies the starting fetters."
 eu4ap_rescan_title:0 "§MArchipelago: scan objectives now§!"
 eu4ap_rescan_desc:0 "Applies installed items, scans objectives and writes the state to the game log."
 eu4ap_ratify_title:0 "§MArchipelago: ratify the victory§!"
 eu4ap_ratify_desc:0 "Requires the ambition 'Great Power' and 3 Seals of the Multiworld and its keys or levels."
 eu4ap_pilgrimage_title:0 "§MArchipelago: golden pilgrimage§!"
 eu4ap_pilgrimage_desc:0 "Spend 3000 ducats without loans to complete the golden pilgrimage."
 eu4ap.3.t:0 "Archipelago: deliveries from the multiworld"
 eu4ap.3.d:0 "Items sent by the other players of the multiworld have arrived. Modifiers named 'Archipelago' show the remaining fetters."
 eu4ap.3.a:0 "Excellent."
 eu4ap_claim_delivery_title:0 "§MArchipelago: receive a delivery§!"
